# Quem chama, do jeito que a API deve ver (com TRUST_PROXY=1 ela confia em um salto: este nginx).
# O X-Forwarded-For é REESCRITO com o IP que este nginx enxergou, não somado ao que o navegador mandou: um
# cabeçalho forjado pelo cliente nunca chega à API. Na porta do túnel, esse IP já é o da Cloudflare
# (CF-Connecting-IP, ver default.conf.template); na porta publicada, é o da conexão.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $mixtape_proto;
# A API não lê estes; vazios, o nginx nem os repassa (ninguém escolhe o próprio IP por eles).
proxy_set_header CF-Connecting-IP "";
proxy_set_header True-Client-IP "";
