# Integração contínua do plataforma_mixtape-v1: auditoria das dependências, lint, tipos, testes, traduções,
# ícones, o build do Vite e a imagem Docker, em pull request e em push na main.
#
# @pedrolucaslopes/mixtape-ui é privada no GitHub Packages. O token de leitura é, de preferência, o
# GITHUB_TOKEN desta execução: basta dar a este repositório acesso de leitura ao pacote (página do
# pacote > Package settings > Manage Actions access). Sem isso, use um token clássico só com
# read:packages no secret MIXTAPE_LIB_TOKEN.
#
# O pipeline também é superfície de ataque: as actions vão fixadas por commit (tag pode ser movida),
# o token só lê, e o checkout não deixa credencial no disco para os passos seguintes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Auditoria, lint, tipos, testes, build e imagem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.MIXTAPE_LIB_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar
        run: npm ci

      # O que vai para o navegador não passa com aviso nenhum; o resto, sem alto.
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=moderate

      - name: Auditar todas as dependências
        run: npm audit --audit-level=high

      - run: npm run lint
      - run: npm test

      # Tipos, traduções, ícones e o build do Vite, na mesma ordem do Dockerfile.
      - run: npm run build

      # O token entra como secret do BuildKit: não vira camada nem aparece no histórico da imagem.
      - name: Construir a imagem
        run: docker build --secret id=node_auth_token,env=NODE_AUTH_TOKEN --tag mixtape-web:ci .
