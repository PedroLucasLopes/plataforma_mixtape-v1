name: mixtape-web-v1

# Front do Mixtape em um container próprio (nginx). Configuração local no .env desta pasta
# (copie de .env.example). A API roda no compose dela (mixtape-api-v1); sem rede compartilhada,
# o nginx chega à API pela porta publicada na máquina (host.docker.internal).

services:
  web:
    build:
      context: .
      args:
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
      secrets:
        - node_auth_token
    image: mixtape-web:local
    restart: unless-stopped
    environment:
      MIXTAPE_API_UPSTREAM: ${MIXTAPE_API_UPSTREAM:?defina MIXTAPE_API_UPSTREAM no .env}
      MIXTAPE_PUBLIC_URL: ${MIXTAPE_PUBLIC_URL:?defina MIXTAPE_PUBLIC_URL no .env}
    ports:
      - "${WEB_PORT:-5180}:8080"
    volumes:
      # Cache de capas do nginx (proxy_cache em /var/cache/nginx/covers): fora do container, ele
      # sobrevive aos rebuilds; dentro, cada deploy recomeçava do zero e as capas voltavam a demorar.
      - nginx-cache:/var/cache/nginx
    extra_hosts:
      # No Linux o host.docker.internal não existe por padrão.
      - "host.docker.internal:host-gateway"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

  # Túnel da Cloudflare: liga este site à borda (CDN, firewall, Turnstile, Access) sem abrir porta nenhuma na máquina;
  # é o cloudflared que sai e se conecta à Cloudflare. Só sobe com o perfil "cloudflare" (COMPOSE_PROFILES=cloudflare)
  # e o token do túnel no .env (CLOUDFLARE_TUNNEL_TOKEN, gravado pelo `npm run edge:apply -- --write-env`). Entra no
  # nginx pela porta 8081, a única que aceita o IP de quem abriu o site vindo da Cloudflare (e que não é publicada).
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["cloudflare"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN

volumes:
  nginx-cache:
